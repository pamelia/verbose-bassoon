apiVersion: apps/v1
kind: Deployment
metadata:
  name: spanish-study
  namespace: dale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spanish-study
  template:
    metadata:
      labels:
        app: spanish-study
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: app
        image: ghcr.io/pamelia/verbose-bassoon:1790613018-3303366 # {"$imagepolicy": "flux-system:dale"}
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dale-postgres-app
              key: uri
        - name: TRUST_PROXY_IDENTITY
          value: "true"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spanish-study
  namespace: dale
spec:
  selector:
    app: spanish-study
  ports:
  - name: http
    port: 80
    targetPort: http
